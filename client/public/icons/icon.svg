<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Stethoscope icon -->
  <g transform="translate(96, 96)" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Earpieces -->
    <path d="M80 40 L80 120 C80 160 120 200 160 200 C200 200 240 160 240 120 L240 40"/>
    <!-- Tube -->
    <path d="M160 200 L160 280"/>
    <!-- Chest piece -->
    <circle cx="160" cy="280" r="40" fill="white" stroke="white"/>
    <circle cx="160" cy="280" r="20" fill="#2563eb"/>
    <!-- Plus sign for medical -->
    <line x1="100" y1="40" x2="100" y2="80" stroke="white" stroke-width="16"/>
    <line x1="80" y1="60" x2="120" y2="60" stroke="white" stroke-width="16"/>
    <line x1="220" y1="40" x2="220" y2="80" stroke="white" stroke-width="16"/>
    <line x1="200" y1="60" x2="240" y2="60" stroke="white" stroke-width="16"/>
  </g>
  <!-- Calculator text hint -->
  <text x="256" y="460" font-family="system-ui, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">CALC</text>
</svg>
