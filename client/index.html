<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes" />

    <!-- Primary Meta Tags -->
    <title>MedResearch Academy - Clinical Calculator</title>
    <meta name="title" content="MedResearch Academy - Clinical Calculator" />
    <meta name="description" content="Evidence-based clinical decision support calculators for healthcare professionals. 32+ medical calculators including qSOFA, HEART, CHA₂DS₂-VASc, MELD, and more." />
    <meta name="keywords" content="medical calculator, clinical decision support, qSOFA, HEART score, MELD, CHA2DS2VASc, sepsis, stroke risk, healthcare" />
    <meta name="author" content="MedResearch Academy" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MedCalc" />
    <meta name="application-name" content="MedCalc" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/jpeg" href="/medresearch-academy-logo.jpg" />
    <link rel="apple-touch-icon" href="/medresearch-academy-logo.jpg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medresearch.academy/" />
    <meta property="og:title" content="MedResearch Academy - Clinical Calculator" />
    <meta property="og:description" content="Evidence-based clinical decision support calculators for healthcare professionals." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://medresearch.academy/" />
    <meta property="twitter:title" content="MedResearch Academy - Clinical Calculator" />
    <meta property="twitter:description" content="Evidence-based clinical decision support calculators for healthcare professionals." />
    <meta property="twitter:image" content="/og-image.png" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Main App Script -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);

              // Check for updates periodically
              setInterval(() => {
                registration.update();
              }, 60 * 60 * 1000); // Check every hour
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>

    <!-- Analytics (optional) -->
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
